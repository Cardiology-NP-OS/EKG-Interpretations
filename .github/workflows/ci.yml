name: EKG Recovery CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  synthetic-contract-ci:
    name: Synthetic contract CI (non-clinical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run self-contained contract tests
        run: npm test
      - name: Run CI evidence-boundary gate
        run: npm run gate:ci
      - name: Report external-source preflight
        env:
          EKG_PTBXL_RECORD_DIR: ${{ runner.temp }}/ptbxl-not-provided
        run: npm run source:preflight

  quarantined-clinical-control-candidate:
    name: Quarantined V12.1 candidate validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run quarantined candidate gate
        run: python clinical_control/v12_1_candidate/tests/run_candidate_gate.py
      - name: Run PKT-EP1-07 measurement evidence gate
        run: python clinical_control/v12_1_candidate/tests/run_pkt07_gate.py
      - name: Run PKT-EP1-09 evaluation gate
        run: python tools/pkt09_evaluation_gate.py
      - name: Run EP3 packet 1 system status gate
        run: python tools/ep3_pkt01_status_gate.py
      - name: Run EP3 packet 2 source-evidence bridge gate
        run: python tools/ep3_pkt02_evidence_gate.py
      - name: Run EP3 packet 3 signal/QC exposure gate
        run: python tools/ep3_pkt03_signal_qc_gate.py
      - name: Run EP3 packet 4 blinded-review gate
        run: python tools/ep3_pkt04_blinded_review_gate.py
      - name: Run EP3 packet 5 candidate-control reconciliation gate
        run: python tools/ep3_pkt05_candidate_control_gate.py
      - name: Run EP3 packet 6 adjudication-dataset gate
        run: python tools/ep3_pkt06_adjudication_dataset_gate.py
      - name: Run EP3 packet 7 metric-reporting eligibility gate
        run: python tools/ep3_pkt07_metric_reporting_gate.py
      - name: Run EP3 packet 8 diagnostic activation gate
        run: python tools/ep3_pkt08_diagnostic_activation_gate.py
      - name: Run EP3 packet 9 integration freeze gate
        run: python tools/ep3_pkt09_integration_freeze_gate.py
      - name: Run EP5 packet 1 Stage-3 baseline gate
        run: python tools/ep5_pkt01_stage3_baseline_gate.py
      - name: Run EP5 packet 2 compatibility attestation gate
        run: python tools/ep5_pkt02_compatibility_attestation_gate.py
      - name: Run EP5 packet 3 fresh-host recovery reproduction gate
        run: python tools/ep5_pkt03_recovery_reproduction_gate.py
      - name: Run EP5 packet 4 repin authorization gate
        run: python tools/ep5_pkt04_repin_authorization_gate.py
      - name: Run EP5 packet 5 reconciliation acknowledgement gate
        run: python tools/ep5_pkt05_reconciliation_acknowledgement_gate.py
      - name: Run EP5 packet 6 evidence admission readiness gate
        run: python tools/ep5_pkt06_evidence_admission_readiness_gate.py
      - name: Run EP5 packet 7 engineering-ready inactive release candidate gate
        run: python tools/ep5_pkt07_engineering_release_candidate_gate.py
      - name: Run EP5 packet 8 evidence intake quarantine gate
        run: python tools/ep5_pkt08_evidence_intake_quarantine_gate.py
