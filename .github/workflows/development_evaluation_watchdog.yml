name: Development ECG evaluation watchdog

on:
  schedule:
    - cron: "53 9 * * *"
  workflow_dispatch:
  workflow_run:
    workflows: ["Development ECG evaluation"]
    types: [completed]

permissions:
  contents: read

jobs:
  record-source-attempt:
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      receipt_sha256: ${{ steps.receipt.outputs.receipt_sha256 }}
      phase: ${{ steps.receipt.outputs.phase }}
      pre_launch_failure: ${{ steps.receipt.outputs.pre_launch_failure }}
      observation_incomplete: ${{ steps.receipt.outputs.observation_incomplete }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Fetch exact source attempt metadata and create receipt
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          OBSERVER_RUN_ID: ${{ github.run_id }}
          OBSERVER_RUN_ATTEMPT: ${{ github.run_attempt }}
          OBSERVER_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$SOURCE_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$OBSERVER_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$OBSERVER_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          [[ "$OBSERVER_SHA" =~ ^[0-9a-f]{40}$ ]]
          receipt="$RUNNER_TEMP/development-workflow-attempt-receipt.json"
          jobs="$RUNNER_TEMP/development-workflow-attempt-jobs.json"
          create_receipt() {
            node tools/record_development_workflow_attempt.js --event "$GITHUB_EVENT_PATH" --jobs "$jobs" --repository "$GH_REPO" --workflow-path ".github/workflows/development_evaluation.yml" --observer-run-id "$OBSERVER_RUN_ID" --observer-run-attempt "$OBSERVER_RUN_ATTEMPT" --observer-sha "$OBSERVER_SHA" --observer-workflow-path ".github/workflows/development_evaluation_watchdog.yml" --output "$receipt"
          }
          summary=""
          for delay in 0 2 4 8 16; do
            if [ "$delay" -gt 0 ]; then sleep "$delay"; fi
            rm -f "$receipt"
            if gh api "repos/$GH_REPO/actions/runs/$SOURCE_RUN_ID/attempts/$SOURCE_RUN_ATTEMPT/jobs?per_page=100" > "$jobs" && summary="$(create_receipt)"; then
              break
            fi
            summary=""
          done
          if [ -z "$summary" ]; then
            rm -f "$receipt"
            printf '{"total_count":0,"jobs":[]}\n' > "$jobs"
            summary="$(create_receipt)"
          fi
          printf '%s\n' "$summary"
          node -e "const value=JSON.parse(process.argv[1]);for(const key of ['receiptSha256','phase','preLaunchFailure','observationIncomplete'])process.stdout.write(key.replace(/[A-Z]/g,c=>'_'+c.toLowerCase())+'='+value[key]+'\n')" "$summary" >> "$GITHUB_OUTPUT"
      - name: Upload control-plane attempt receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: development-workflow-attempt-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-observer-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/development-workflow-attempt-receipt.json
          if-no-files-found: error
          retention-days: 90

  alert-source-attempt:
    needs: record-source-attempt
    if: ${{ always() && needs.record-source-attempt.result == 'success' && (needs.record-source-attempt.outputs.pre_launch_failure == 'true' || needs.record-source-attempt.outputs.observation_incomplete == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Alert exact source attempt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_URL: ${{ github.event.workflow_run.html_url }}
          PHASE: ${{ needs.record-source-attempt.outputs.phase }}
          PRE_LAUNCH_FAILURE: ${{ needs.record-source-attempt.outputs.pre_launch_failure }}
          RECEIPT_SHA256: ${{ needs.record-source-attempt.outputs.receipt_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$PRE_LAUNCH_FAILURE" = "true" ]; then
            title="Development ECG pre-launch failure run $SOURCE_RUN_ID attempt $SOURCE_RUN_ATTEMPT"
          else
            title="Development ECG observation incomplete run $SOURCE_RUN_ID attempt $SOURCE_RUN_ATTEMPT"
          fi
          existing="$(gh issue list --state open --search "in:title $title" --json number --jq 'length')"
          if [ "$existing" = "0" ]; then
            gh issue create --title "$title" --body "The independently hosted control-plane observer recorded phase $PHASE for $SOURCE_URL. Receipt SHA-256: $RECEIPT_SHA256. This receipt has no evaluation signature, corpus access, bundle-validity authority, clinical result, or WORM attestation."
          fi

  detect-missed-run:
    if: ${{ github.event_name != 'workflow_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - name: Check latest scheduled evaluation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          recent="$(gh run list --workflow development_evaluation.yml --event schedule --limit 20 --json createdAt,conclusion,status,url)"
          node -e "const rows=JSON.parse(process.argv[1]);const cutoff=Date.now()-30*60*60*1000;if(!rows.some(row=>Date.parse(row.createdAt)>=cutoff&&row.status==='completed'&&row.conclusion==='success'))process.exit(2)" "$recent" || {
            title="Development ECG evaluation missed or failed"
            existing="$(gh issue list --state open --search "in:title $title" --json number --jq 'length')"
            if [ "$existing" = "0" ]; then
              gh issue create --title "$title" --body "The scheduled development-only ECG evaluation has no successful completed run in the last 30 hours. Inspect the self-hosted runner and governed corpus/WORM configuration. This is an engineering capability alert, not a clinical result."
            fi
            exit 1
          }
